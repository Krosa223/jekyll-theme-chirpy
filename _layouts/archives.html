---
layout: page
# Air Hockey playground
---

<style>
  .archive-hockey {
    --hockey-ink: var(--text-color);
    display: grid;
    gap: 0.9rem;
    max-width: 58rem;
    margin: 0 auto;
  }

  .archive-hockey-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.8rem;
    flex-wrap: wrap;
  }

  .archive-hockey-score {
    display: flex;
    align-items: baseline;
    gap: 0.55rem;
    font-variant-numeric: tabular-nums;
  }

  .archive-hockey-score strong {
    font-size: clamp(1.25rem, 2.8vw, 1.8rem);
    line-height: 1;
  }

  .archive-hockey-score > span {
    opacity: 0.62;
  }

  .archive-hockey-hint {
    margin: 0.35rem 0 0;
    font-size: 0.82rem;
    opacity: 0.72;
  }

  .archive-hockey-actions {
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
  }

  .archive-hockey-actions button {
    min-height: 2.35rem;
    padding: 0.45rem 0.8rem;
    border: 1px solid rgb(255 255 255 / 0.62);
    border-radius: 999px;
    background: rgb(255 255 255 / 0.48);
    color: var(--hockey-ink);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.66);
    -webkit-backdrop-filter: blur(8px) saturate(120%);
    backdrop-filter: blur(8px) saturate(120%);
  }

  .archive-hockey-rink {
    position: relative;
    overflow: hidden;
    border: 1px solid rgb(255 255 255 / 0.74);
    border-radius: 1.25rem;
    background:
      linear-gradient(90deg, rgb(83 178 218 / 0.10), transparent 34%, transparent 66%, rgb(232 101 117 / 0.10)),
      linear-gradient(180deg, rgb(247 253 255 / 0.46), rgb(218 241 248 / 0.22));
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / 0.84),
      0 14px 34px rgb(14 42 57 / 0.12);
    -webkit-backdrop-filter: blur(7px) saturate(112%);
    backdrop-filter: blur(7px) saturate(112%);
  }

  .archive-hockey-canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 9 / 5;
    touch-action: none;
  }

  .archive-hockey-message {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    opacity: 1;
    transition: opacity 150ms ease;
  }

  .archive-hockey-message:not(.is-visible) {
    opacity: 0;
  }

  .archive-hockey-message > span {
    padding: 0.55rem 0.9rem;
    border: 1px solid rgb(255 255 255 / 0.68);
    border-radius: 999px;
    background: rgb(247 252 255 / 0.74);
    color: #173849;
    font-weight: 700;
    box-shadow: 0 8px 22px rgb(15 38 52 / 0.14);
    -webkit-backdrop-filter: blur(9px);
    backdrop-filter: blur(9px);
  }

  @media (hover: hover) and (pointer: fine) {
    .archive-hockey-canvas {
      cursor: none;
    }
  }

  @media (max-width: 640px) {
    .archive-hockey-actions {
      width: 100%;
    }

    .archive-hockey-actions button {
      flex: 1 1 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .archive-hockey-message {
      transition: none;
    }
  }
</style>

<div class="archive-hockey" data-archive-hockey>
  <div class="archive-hockey-toolbar">
    <div>
      <div class="archive-hockey-score" aria-live="polite">
        <strong><span data-player-score>0</span> : <span data-ai-score>0</span></strong>
        <span>先到 5 分</span>
      </div>
      <p class="archive-hockey-hint">
        把鼠标圆片当球杆，拖尾就是挥杆轨迹。把冰球打进右侧球门。
      </p>
    </div>

    <div class="archive-hockey-actions">
      <button type="button" data-hockey-toggle>开始</button>
      <button type="button" data-hockey-reset>重开</button>
    </div>
  </div>

  <div class="archive-hockey-rink">
    <canvas
      class="archive-hockey-canvas"
      data-hockey-canvas
      width="900"
      height="500"
      aria-label="鼠标冰球小游戏。移动鼠标击打冰球，目标是把球打进右侧球门。"
      tabindex="0"
    ></canvas>

    <div class="archive-hockey-message is-visible" data-hockey-message aria-live="polite">
      <span>正在加载冰场…</span>
    </div>
  </div>
</div>

<script data-swup-reload-script>
(function () {
  'use strict';

  var root = document.querySelector('[data-archive-hockey]');
  if (!root || root.dataset.hockeyReady === 'true') return;

  root.dataset.hockeyReady = 'true';

  var canvas = root.querySelector('[data-hockey-canvas]');
  var context = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var toggleButton = root.querySelector('[data-hockey-toggle]');
  var resetButton = root.querySelector('[data-hockey-reset]');
  var playerScoreNode = root.querySelector('[data-player-score]');
  var aiScoreNode = root.querySelector('[data-ai-score]');
  var message = root.querySelector('[data-hockey-message]');
  var messageText = message ? message.querySelector('span') : null;

  if (
    !canvas ||
    !context ||
    !toggleButton ||
    !resetButton ||
    !playerScoreNode ||
    !aiScoreNode ||
    !message ||
    !messageText
  ) {
    if (message && messageText) {
      message.classList.add('is-visible');
      messageText.textContent = '冰场初始化失败';
    }
    return;
  }

  var controller = new AbortController();
  var signal = controller.signal;
  var animationFrame = 0;
  var serveTimer = null;

  var WIDTH = 900;
  var HEIGHT = 500;
  var GOAL_HALF = 74;
  var PUCK_RADIUS = 13;
  var AI_RADIUS = 24;
  var PLAYER_RADIUS = 18;
  var WIN_SCORE = 5;
  var MAX_PUCK_SPEED = 620;
  var MAX_PADDLE_TRANSFER_SPEED = 1350;
  var AI_SPEED = 285;

  var running = false;
  var ended = false;
  var playerScore = 0;
  var aiScore = 0;
  var lastTime = 0;
  var pointerInside = false;

  var fallbackPointer = {
    x: 190,
    y: HEIGHT / 2,
    active: false
  };

  var player = {
    x: 190,
    y: HEIGHT / 2,
    previousX: 190,
    previousY: HEIGHT / 2,
    vx: 0,
    vy: 0,
    radius: PLAYER_RADIUS
  };

  var ai = {
    x: WIDTH - 135,
    y: HEIGHT / 2,
    previousX: WIDTH - 135,
    previousY: HEIGHT / 2,
    vx: 0,
    vy: 0,
    radius: AI_RADIUS
  };

  var puck = {
    x: WIDTH / 2,
    y: HEIGHT / 2,
    vx: 0,
    vy: 0,
    radius: PUCK_RADIUS
  };

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function setMessage(text, visible) {
    messageText.textContent = text || '';
    message.classList.toggle('is-visible', Boolean(visible));
  }

  function syncScore() {
    playerScoreNode.textContent = String(playerScore);
    aiScoreNode.textContent = String(aiScore);
  }

  function pointFromClient(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var width = Math.max(1, rect.width);
    var height = Math.max(1, rect.height);

    return {
      x: (clientX - rect.left) * WIDTH / width,
      y: (clientY - rect.top) * HEIGHT / height,
      scale: WIDTH / width,
      inside:
        clientX >= rect.left &&
        clientX <= rect.right &&
        clientY >= rect.top &&
        clientY <= rect.bottom
    };
  }

  function readVisibleCursor() {
    var api = window.krosaGlassCursor;

    if (api && typeof api.getState === 'function') {
      var state = api.getState();

      if (state && state.visible) {
        var mapped = pointFromClient(state.x, state.y);

        if (mapped.inside) {
          return {
            x: mapped.x,
            y: mapped.y,
            radius: clamp((state.radius || 16) * mapped.scale, 14, 26),
            active: true
          };
        }
      }
    }

    if (fallbackPointer.active && pointerInside) {
      return {
        x: fallbackPointer.x,
        y: fallbackPointer.y,
        radius: PLAYER_RADIUS,
        active: true
      };
    }

    return {
      x: player.x,
      y: player.y,
      radius: player.radius,
      active: false
    };
  }

  function updatePlayer(dt) {
    var cursor = readVisibleCursor();

    player.previousX = player.x;
    player.previousY = player.y;
    player.radius = cursor.radius || PLAYER_RADIUS;

    if (cursor.active) {
      player.x = clamp(cursor.x, player.radius + 8, WIDTH - player.radius - 8);
      player.y = clamp(cursor.y, player.radius + 8, HEIGHT - player.radius - 8);
    }

    player.vx = (player.x - player.previousX) / Math.max(dt, 0.001);
    player.vy = (player.y - player.previousY) / Math.max(dt, 0.001);
  }

  function updateAi(dt) {
    ai.previousX = ai.x;
    ai.previousY = ai.y;

    var homeX = WIDTH - 135;
    var targetX =
      puck.x > WIDTH * 0.48
        ? clamp(puck.x + 52, WIDTH * 0.56, WIDTH - 76)
        : homeX;
    var targetY = puck.x > WIDTH * 0.42 ? puck.y : HEIGHT / 2;

    var dx = targetX - ai.x;
    var dy = targetY - ai.y;
    var distance = Math.hypot(dx, dy);
    var maxStep = AI_SPEED * dt;

    if (distance > 0.01) {
      var step = Math.min(distance, maxStep);
      ai.x += dx / distance * step;
      ai.y += dy / distance * step;
    }

    ai.x = clamp(ai.x, WIDTH * 0.54 + ai.radius, WIDTH - ai.radius - 18);
    ai.y = clamp(ai.y, ai.radius + 12, HEIGHT - ai.radius - 12);

    ai.vx = (ai.x - ai.previousX) / Math.max(dt, 0.001);
    ai.vy = (ai.y - ai.previousY) / Math.max(dt, 0.001);
  }

  function limitPuckSpeed() {
    var speed = Math.hypot(puck.vx, puck.vy);

    if (speed > MAX_PUCK_SPEED) {
      var scale = MAX_PUCK_SPEED / Math.max(speed, 0.001);
      puck.vx *= scale;
      puck.vy *= scale;
    }
  }

  /*
   * Swept-circle collision:
   * test the entire relative-motion segment during this frame.
   * This prevents a fast cursor from tunneling through the puck.
   */
  function collidePaddle(paddle, strength, puckStartX, puckStartY) {
    var minDistance = puck.radius + paddle.radius;

    var relStartX = puckStartX - paddle.previousX;
    var relStartY = puckStartY - paddle.previousY;
    var relEndX = puck.x - paddle.x;
    var relEndY = puck.y - paddle.y;

    var moveX = relEndX - relStartX;
    var moveY = relEndY - relStartY;
    var moveLengthSq = moveX * moveX + moveY * moveY;

    var hitTime = 0;

    if (moveLengthSq > 0.000001) {
      hitTime = clamp(
        -(
          relStartX * moveX +
          relStartY * moveY
        ) / moveLengthSq,
        0,
        1
      );
    }

    var closestX = relStartX + moveX * hitTime;
    var closestY = relStartY + moveY * hitTime;
    var closestDistance = Math.hypot(closestX, closestY);
    var finalDistance = Math.hypot(relEndX, relEndY);

    if (
      closestDistance >= minDistance &&
      finalDistance >= minDistance
    ) {
      return false;
    }

    var paddleHitX =
      paddle.previousX + (paddle.x - paddle.previousX) * hitTime;
    var paddleHitY =
      paddle.previousY + (paddle.y - paddle.previousY) * hitTime;

    var nx;
    var ny;

    if (closestDistance > 0.001) {
      nx = closestX / closestDistance;
      ny = closestY / closestDistance;
    } else if (finalDistance > 0.001) {
      nx = relEndX / finalDistance;
      ny = relEndY / finalDistance;
    } else {
      nx = 1;
      ny = 0;
    }

    puck.x = paddleHitX + nx * minDistance;
    puck.y = paddleHitY + ny * minDistance;

    var paddleVx = paddle.vx;
    var paddleVy = paddle.vy;
    var paddleSpeed = Math.hypot(paddleVx, paddleVy);

    if (paddleSpeed > MAX_PADDLE_TRANSFER_SPEED) {
      var paddleScale = MAX_PADDLE_TRANSFER_SPEED / paddleSpeed;
      paddleVx *= paddleScale;
      paddleVy *= paddleScale;
    }

    var relativeVx = puck.vx - paddleVx;
    var relativeVy = puck.vy - paddleVy;
    var alongNormal = relativeVx * nx + relativeVy * ny;

    if (alongNormal < 0) {
      puck.vx -= 1.78 * alongNormal * nx;
      puck.vy -= 1.78 * alongNormal * ny;
    }

    puck.vx += paddleVx * strength;
    puck.vy += paddleVy * strength;

    limitPuckSpeed();
    return true;
  }

  function clearServeTimer() {
    if (serveTimer !== null) {
      window.clearTimeout(serveTimer);
      serveTimer = null;
    }
  }

  function resetPuck(direction) {
    clearServeTimer();

    puck.x = WIDTH / 2;
    puck.y = HEIGHT / 2;
    puck.vx = 0;
    puck.vy = 0;

    serveTimer = window.setTimeout(function () {
      serveTimer = null;

      if (!running || ended) return;

      puck.vx = 225 * direction;
      puck.vy = ((Math.random() * 2) - 1) * 88;
      limitPuckSpeed();
    }, 350);
  }

  function scoreGoal(playerScored) {
    if (playerScored) playerScore += 1;
    else aiScore += 1;

    syncScore();

    if (playerScore >= WIN_SCORE || aiScore >= WIN_SCORE) {
      ended = true;
      running = false;
      toggleButton.textContent = '再来一局';
      setMessage(playerScore >= WIN_SCORE ? '你赢了！' : '电脑赢了', true);
      puck.vx = 0;
      puck.vy = 0;
      return;
    }

    setMessage(playerScored ? '得分！' : '对方得分', true);

    window.setTimeout(function () {
      if (!ended) setMessage('', false);
    }, 480);

    resetPuck(playerScored ? -1 : 1);
  }

  function updatePuck(dt) {
    var puckStartX = puck.x;
    var puckStartY = puck.y;

    puck.x += puck.vx * dt;
    puck.y += puck.vy * dt;

    var drag = Math.pow(0.996, dt * 60);
    puck.vx *= drag;
    puck.vy *= drag;

    collidePaddle(player, 0.28, puckStartX, puckStartY);
    collidePaddle(ai, 0.17, puckStartX, puckStartY);
    limitPuckSpeed();

    if (puck.y - puck.radius < 8) {
      puck.y = 8 + puck.radius;
      puck.vy = Math.abs(puck.vy) * 0.975;
    } else if (puck.y + puck.radius > HEIGHT - 8) {
      puck.y = HEIGHT - 8 - puck.radius;
      puck.vy = -Math.abs(puck.vy) * 0.975;
    }

    var inGoalMouth = Math.abs(puck.y - HEIGHT / 2) <= GOAL_HALF;

    if (puck.x + puck.radius < 0 && inGoalMouth) {
      scoreGoal(false);
      return;
    }

    if (puck.x - puck.radius > WIDTH && inGoalMouth) {
      scoreGoal(true);
      return;
    }

    if (!inGoalMouth) {
      if (puck.x - puck.radius < 8) {
        puck.x = 8 + puck.radius;
        puck.vx = Math.abs(puck.vx) * 0.975;
      } else if (puck.x + puck.radius > WIDTH - 8) {
        puck.x = WIDTH - 8 - puck.radius;
        puck.vx = -Math.abs(puck.vx) * 0.975;
      }
    }

    limitPuckSpeed();

    var speed = Math.hypot(puck.vx, puck.vy);
    if (speed < 30 && running) {
      puck.vx += (puck.x < WIDTH / 2 ? 1 : -1) * 4;
      limitPuckSpeed();
    }
  }

  function roundedRect(ctx, x, y, width, height, radius) {
    var r = Math.min(radius, width / 2, height / 2);

    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + width, y, x + width, y + height, r);
    ctx.arcTo(x + width, y + height, x, y + height, r);
    ctx.arcTo(x, y + height, x, y, r);
    ctx.arcTo(x, y, x + width, y, r);
    ctx.closePath();
  }

  function drawRink() {
    context.clearRect(0, 0, WIDTH, HEIGHT);

    var ice = context.createLinearGradient(0, 0, WIDTH, HEIGHT);
    ice.addColorStop(0, 'rgba(247, 253, 255, 0.34)');
    ice.addColorStop(0.5, 'rgba(217, 242, 250, 0.14)');
    ice.addColorStop(1, 'rgba(247, 253, 255, 0.27)');
    context.fillStyle = ice;
    context.fillRect(0, 0, WIDTH, HEIGHT);

    context.lineWidth = 4;
    context.strokeStyle = 'rgba(246, 253, 255, 0.94)';
    roundedRect(context, 7, 7, WIDTH - 14, HEIGHT - 14, 30);
    context.stroke();

    context.lineWidth = 2;
    context.strokeStyle = 'rgba(94, 187, 217, 0.72)';
    context.beginPath();
    context.moveTo(WIDTH / 2, 14);
    context.lineTo(WIDTH / 2, HEIGHT - 14);
    context.stroke();

    context.fillStyle = 'rgba(94, 187, 217, 0.10)';
    context.beginPath();
    context.arc(WIDTH / 2, HEIGHT / 2, 72, 0, Math.PI * 2);
    context.fill();
    context.stroke();

    context.strokeStyle = 'rgba(224, 88, 108, 0.66)';
    context.beginPath();
    context.moveTo(95, 14);
    context.lineTo(95, HEIGHT - 14);
    context.moveTo(WIDTH - 95, 14);
    context.lineTo(WIDTH - 95, HEIGHT - 14);
    context.stroke();

    context.lineWidth = 5;
    context.strokeStyle = 'rgba(255, 255, 255, 0.84)';
    context.beginPath();
    context.moveTo(2, HEIGHT / 2 - GOAL_HALF);
    context.lineTo(2, HEIGHT / 2 + GOAL_HALF);
    context.moveTo(WIDTH - 2, HEIGHT / 2 - GOAL_HALF);
    context.lineTo(WIDTH - 2, HEIGHT / 2 + GOAL_HALF);
    context.stroke();

    context.fillStyle = 'rgba(92, 183, 215, 0.18)';
    context.fillRect(0, HEIGHT / 2 - GOAL_HALF, 28, GOAL_HALF * 2);
    context.fillStyle = 'rgba(229, 95, 113, 0.18)';
    context.fillRect(WIDTH - 28, HEIGHT / 2 - GOAL_HALF, 28, GOAL_HALF * 2);
  }

  function drawPuck() {
    context.save();
    context.shadowColor = 'rgba(13, 30, 39, 0.34)';
    context.shadowBlur = 12;
    context.shadowOffsetY = 4;
    context.fillStyle = 'rgba(24, 34, 40, 0.96)';
    context.beginPath();
    context.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
    context.fill();
    context.shadowColor = 'transparent';
    context.strokeStyle = 'rgba(255, 255, 255, 0.46)';
    context.lineWidth = 1.5;
    context.stroke();
    context.restore();
  }

  function drawAi() {
    context.save();
    context.shadowColor = 'rgba(110, 35, 50, 0.30)';
    context.shadowBlur = 14;
    context.fillStyle = 'rgba(220, 86, 107, 0.72)';
    context.beginPath();
    context.arc(ai.x, ai.y, ai.radius, 0, Math.PI * 2);
    context.fill();
    context.shadowColor = 'transparent';
    context.strokeStyle = 'rgba(255, 255, 255, 0.75)';
    context.lineWidth = 2;
    context.stroke();
    context.restore();
  }

  function drawFallbackPlayer() {
    var api = window.krosaGlassCursor;
    var usingGlassCursor =
      api &&
      typeof api.getState === 'function' &&
      window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    if (usingGlassCursor && pointerInside) return;

    context.save();
    context.fillStyle = 'rgba(72, 169, 207, 0.58)';
    context.strokeStyle = 'rgba(255, 255, 255, 0.80)';
    context.lineWidth = 2;
    context.beginPath();
    context.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    context.fill();
    context.stroke();
    context.restore();
  }

  function render() {
    drawRink();
    drawAi();
    drawFallbackPlayer();
    drawPuck();
  }

  function frame(time) {
    animationFrame = 0;

    if (!lastTime) lastTime = time;
    var dt = clamp((time - lastTime) / 1000, 0, 0.032);
    lastTime = time;

    updatePlayer(dt);

    if (running && !ended) {
      updateAi(dt);
      updatePuck(dt);
    }

    render();
    animationFrame = window.requestAnimationFrame(frame);
  }

  function startGame() {
    if (ended) {
      playerScore = 0;
      aiScore = 0;
      ended = false;
      syncScore();
    }

    running = true;
    toggleButton.textContent = '暂停';
    setMessage('', false);

    if (Math.hypot(puck.vx, puck.vy) < 1) {
      resetPuck(1);
    }
  }

  function pauseGame() {
    running = false;
    clearServeTimer();
    toggleButton.textContent = '继续';
    setMessage('已暂停', true);
  }

  function resetGame() {
    clearServeTimer();
    running = false;
    ended = false;
    playerScore = 0;
    aiScore = 0;
    syncScore();

    player.x = 190;
    player.y = HEIGHT / 2;
    player.previousX = player.x;
    player.previousY = player.y;

    ai.x = WIDTH - 135;
    ai.y = HEIGHT / 2;
    ai.previousX = ai.x;
    ai.previousY = ai.y;

    puck.x = WIDTH / 2;
    puck.y = HEIGHT / 2;
    puck.vx = 0;
    puck.vy = 0;

    toggleButton.textContent = '开始';
    setMessage('点击“开始”', true);
    render();
  }

  function updateFallbackPointer(event) {
    var mapped = pointFromClient(event.clientX, event.clientY);
    pointerInside = mapped.inside;
    fallbackPointer.x = mapped.x;
    fallbackPointer.y = mapped.y;
    fallbackPointer.active = true;
  }

  canvas.addEventListener('pointerenter', function (event) {
    pointerInside = true;
    updateFallbackPointer(event);
  }, { signal: signal });

  canvas.addEventListener('pointermove', function (event) {
    updateFallbackPointer(event);
  }, { passive: true, signal: signal });

  canvas.addEventListener('pointerleave', function () {
    pointerInside = false;
  }, { signal: signal });

  canvas.addEventListener('pointerdown', function (event) {
    updateFallbackPointer(event);

    try {
      canvas.focus({ preventScroll: true });
    } catch (error) {
      canvas.focus();
    }

    if (!running && !ended) {
      startGame();
    }
  }, { signal: signal });

  canvas.addEventListener('keydown', function (event) {
    if (event.key === ' ' || event.key === 'Enter') {
      event.preventDefault();
      if (running) pauseGame();
      else startGame();
      return;
    }

    var step = 24;

    if (event.key === 'ArrowLeft' || event.key === 'a') player.x -= step;
    else if (event.key === 'ArrowRight' || event.key === 'd') player.x += step;
    else if (event.key === 'ArrowUp' || event.key === 'w') player.y -= step;
    else if (event.key === 'ArrowDown' || event.key === 's') player.y += step;
    else return;

    event.preventDefault();
    player.x = clamp(player.x, player.radius + 8, WIDTH - player.radius - 8);
    player.y = clamp(player.y, player.radius + 8, HEIGHT - player.radius - 8);
    fallbackPointer.active = false;
  }, { signal: signal });

  toggleButton.addEventListener('click', function () {
    if (running) pauseGame();
    else startGame();
  }, { signal: signal });

  resetButton.addEventListener('click', resetGame, { signal: signal });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && running) pauseGame();
  }, { signal: signal });

  function cleanup() {
    controller.abort();
    clearServeTimer();

    if (animationFrame) {
      window.cancelAnimationFrame(animationFrame);
      animationFrame = 0;
    }

    root.dataset.hockeyReady = 'false';
  }

  if (typeof window.krosaRegisterPageCleanup === 'function') {
    window.krosaRegisterPageCleanup(cleanup);
  } else {
    window.krosaPageCleanup = cleanup;
  }

  resetGame();
  setMessage('点击“开始”', true);
  animationFrame = window.requestAnimationFrame(frame);
})();
</script>
